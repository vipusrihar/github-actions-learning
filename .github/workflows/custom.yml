name: Custom Action Flow

on:
    push:
        branches: [develop]
    workflow_dispatch:

jobs:
    custom:
        name: Custom Job
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 18

            - name: Install dependencies and run tests
              working-directory: ./sample-app
              run: |
                  npm install
                  npm test
